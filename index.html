<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Penyidikan Bea Cukai</title>
    <!-- Menggunakan Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom style untuk kotak input berbentuk kapsul lonjong persis seperti referensi */
        .input-pill {
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Card Utama (Split Screen: Kiri Putih/Ilustrasi, Kanan Ungu/Form) -->
    <div class="bg-white w-full max-w-5xl rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2 border border-slate-200">
        
        <!-- KOLOM KIRI: Ilustrasi & Identitas Instansi -->
        <div class="bg-white p-8 md:p-12 flex flex-col justify-between relative overflow-hidden">
            <!-- Elemen Dekoratif Pendukung -->
            <div class="absolute -bottom-10 -left-10 w-48 h-48 bg-indigo-50 rounded-full blur-2xl z-0"></div>
            
            <div class="relative z-10">
                <span class="text-xs font-bold tracking-widest text-indigo-600 uppercase">KPU BC Tipe B Batam</span>
                <h2 class="text-2xl font-bold text-slate-800 mt-2">Sistem Pelaporan & Penyidikan</h2>
                <p class="text-slate-500 text-sm mt-1">Platform terintegrasi untuk pengolahan LPP, LPF, SPLIT, Berita Acara, dan LHP.</p>
            </div>

            <!-- Bagian Ilustrasi / Ikon Utama -->
            <div class="flex flex-col items-center justify-center my-10 relative z-10">
                <div class="relative">
                    <!-- Efek Lingkaran Latar Belakang Ikon -->
                    <div class="absolute inset-0 bg-indigo-100 rounded-full filter blur-xl opacity-70 animate-pulse"></div>
                    <div class="relative w-36 h-36 bg-gradient-to-tr from-indigo-600 to-violet-600 rounded-full flex items-center justify-center shadow-lg text-white">
                        <i class="fa-solid fa-shield-halved text-6xl"></i>
                    </div>
                </div>
                <!-- Label Keamanan / GDPR Style -->
                <div class="mt-6 bg-amber-100 text-amber-800 px-4 py-1.5 rounded-lg text-xs font-bold tracking-wider shadow-sm uppercase border border-amber-200">
                    <i class="fa-solid fa-lock mr-1.5"></i> Secure Access System
                </div>
            </div>

            <div class="text-xs text-slate-400 text-center relative z-10">
                &copy; 2026 Direktorat Jenderal Bea dan Cukai
            </div>
        </div>

        <!-- KOLOM KANAN: Panel Form Login (Warna Ungu Persis Gambar) -->
        <div class="bg-indigo-600 p-8 md:p-12 text-white flex flex-col justify-center relative">
            <div class="mb-8">
                <h1 class="text-3xl font-bold tracking-tight">Welcome!</h1>
                <p class="text-indigo-200 text-sm mt-1">Silakan masukkan kredensial akun Anda.</p>
            </div>

            <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
                <!-- Input Username / NIP -->
                <div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-indigo-300">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="username" required 
                            class="w-full pl-11 pr-5 py-3.5 bg-white text-slate-800 input-pill text-sm focus:outline-none focus:ring-4 focus:ring-indigo-400/50 shadow-inner placeholder-slate-400 font-medium"
                            placeholder="Your name / NIP">
                    </div>
                </div>

                <!-- Input Email / Instansi -->
                <div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-indigo-300">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="email" required 
                            class="w-full pl-11 pr-5 py-3.5 bg-white text-slate-800 input-pill text-sm focus:outline-none focus:ring-4 focus:ring-indigo-400/50 shadow-inner placeholder-slate-400 font-medium"
                            placeholder="Your e-mail">
                    </div>
                </div>

                <!-- Input Password -->
                <div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-indigo-300">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required 
                            class="w-full pl-11 pr-5 py-3.5 bg-white text-slate-800 input-pill text-sm focus:outline-none focus:ring-4 focus:ring-indigo-400/50 shadow-inner placeholder-slate-400 font-medium"
                            placeholder="Create password">
                    </div>
                </div>

                <!-- Indikator Kekuatan Password (Opsional / Dekoratif Sesuai Gambar) -->
                <div class="space-y-1 px-2">
                    <div class="flex justify-between text-[11px] text-indigo-200 font-medium">
                        <span>Password strength</span>
                        <span>Medium</span>
                    </div>
                    <div class="grid grid-cols-4 gap-1.5 h-1.5">
                        <div class="bg-amber-400 rounded-full"></div>
                        <div class="bg-amber-400 rounded-full"></div>
                        <div class="bg-amber-400 rounded-full"></div>
                        <div class="bg-indigo-400/40 rounded-full"></div>
                    </div>
                </div>

                <!-- Tombol Aksi Bawah (Dua Tombol: Kiri Oranye, Kanan Outline Putih) -->
                <div class="flex items-center gap-4 pt-2">
                    <button type="button" onclick="alert('Fitur registrasi akun baru dibatasi untuk internal penyidik.')"
                        class="flex-1 bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold py-3.5 px-4 input-pill shadow-md transition duration-200 text-xs uppercase tracking-wider text-center">
                        Create account
                    </button>
                    <button type="submit" 
                        class="flex-1 bg-transparent hover:bg-white/10 text-white border-2 border-white font-bold py-3 px-4 input-pill transition duration-200 text-xs uppercase tracking-wider text-center">
                        Sign in
                    </button>
                </div>
            </form>
        </div>

    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            alert('Login berhasil! Selamat datang, ' + username + '. Melanjutkan ke halaman utama form penyidikan...');
            // window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
